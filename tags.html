<script>
(function () {
  var cloudEl = document.getElementById('tag-cloud');
  var resultsEl = document.getElementById('tag-results');
  var emptyEl = document.getElementById('tag-empty');

  function getActiveTag() {
    var params = new URLSearchParams(window.location.search);
    return params.get('tag');
  }

  function cardHTML(item) {
    var href = item.url.replace(/^\//, '');
    var section = item.section || '';
    var category = item.category || '';
    var kicker = [section, category].filter(Boolean).join(' · ');
    return (
      '<a class="article-card" href="' + href + '">' +
      '<p class="article-kicker">' + kicker + '</p>' +
      '<h3>' + item.title + '</h3>' +
      '<p>' + (item.description || '') + '</p>' +
      '<div class="article-meta"><span class="read-link">Read →</span></div>' +
      '</a>'
    );
  }

  function render(data, activeTag) {
    // Build tag -> count map
    var counts = {};
    data.forEach(function (item) {
      (item.tags || []).forEach(function (t) {
        counts[t] = (counts[t] || 0) + 1;
      });
    });
    var tags = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });

    var cloudHTML = '<a class="tag-pill' + (!activeTag ? ' active' : '') + '" href="tags.html">All <span class="tag-count">' + data.length + '</span></a>';
    tags.forEach(function (t) {
      var isActive = t === activeTag;
      cloudHTML += '<a class="tag-pill' + (isActive ? ' active' : '') + '" href="tags.html?tag=' + encodeURIComponent(t) + '">' + t + ' <span class="tag-count">' + counts[t] + '</span></a>';
    });
    cloudEl.innerHTML = cloudHTML;

    var matches = activeTag ? data.filter(function (item) { return (item.tags || []).indexOf(activeTag) !== -1; }) : data;

    if (!matches.length) {
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    resultsEl.innerHTML = matches.map(cardHTML).join('');
  }

  fetch('assets/search-index.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      render(data, getActiveTag());
    })
    .catch(function () {
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      emptyEl.querySelector('#tag-empty-msg').textContent = 'Could not load the topic index right now.';
    });

  window.addEventListener('popstate', function () {
    fetch('assets/search-index.json')
      .then(function (r) { return r.json(); })
      .then(function (data) { render(data, getActiveTag()); });
  });
})();
</script>
