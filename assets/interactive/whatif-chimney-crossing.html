<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossing a chimney wall - What If</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE7D2;--card:#F4EEDD;--ink:#241F16;--soft:#4A4132;--line:rgba(36,31,22,.2);--host:#4F7266;--guest:#8C3F2E;--prop:#6B5B7A;--gold:#B8863F}
:root[data-theme=dark]{--bg:#171B30;--card:#1D2242;--ink:#EDE7D5;--soft:#B7AE95;--line:rgba(237,231,213,.2);--host:#7FB5A2;--guest:#E08A72;--prop:#A596B8;--gold:#D8B570}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:12px 12px 16px}
svg{width:100%;height:auto;display:block}svg text{font-family:"Source Serif 4",Georgia,serif;fill:var(--ink);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button{font:500 .72rem "IBM Plex Mono",monospace;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;min-height:36px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:10px}
.panel h2{font:600 1.05rem Fraunces,Georgia,serif;margin:0 0 6px}.panel p{margin:0 0 8px;font-size:.95rem;line-height:1.55}
.panel .ev{font-size:.82rem;color:var(--soft);border-top:1px solid var(--line);padding-top:8px;margin:8px 0 0}
.key{display:flex;gap:14px;flex-wrap:wrap;font:400 .7rem "IBM Plex Mono",monospace;color:var(--soft);margin-top:10px}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.off{display:none}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--vent:#8C3F2E;--sea:#3F6E8C}:root[data-theme=dark]{--vent:#E08A72;--sea:#7DB0D0}input[type=range]{width:100%;accent-color:var(--gold);margin:6px 0 2px}.lab{font:400 .72rem "IBM Plex Mono",monospace;color:var(--soft);display:flex;justify-content:space-between;gap:8px}.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}.read div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:500 .78rem "IBM Plex Mono",monospace}.read b{display:block;font:600 1.1rem Fraunces,Georgia,serif;margin-top:2px}.bar{display:block;width:100%;height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}svg .t{font-size:11px;text-anchor:middle}
.rung{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 6px;transition:opacity .25s}
.rung.dim{opacity:.22}.rung svg{width:96px;height:auto}.rung h3{font:600 .98rem Fraunces,Georgia,serif;margin:0}.rung p{margin:2px 0 0;font-size:.82rem;line-height:1.4;color:var(--soft)}
.arrow{font:500 .72rem "IBM Plex Mono",monospace;color:var(--gold);text-align:center;margin:-2px 0 4px}.dim+.arrow{opacity:.25}
.go{font:500 .78rem "IBM Plex Mono",monospace;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;cursor:pointer;min-height:38px}
.go[disabled]{opacity:.5;cursor:default}

</style><script>(function(){var r=document.documentElement;function s(){var t=null;try{t=parent.document.documentElement.getAttribute("data-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";r.setAttribute("data-theme",t)}s();try{new MutationObserver(s).observe(parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}})();</script></head><body><main><svg viewBox="0 0 360 190" role="img" aria-labelledby="st"><title id="st">A slice through a chimney wall, vent fluid on the left and ocean on the right</title>
<rect x="0" y="0" width="150" height="190" fill="var(--vent)" opacity=".22"/><rect x="210" y="0" width="150" height="190" fill="var(--sea)" opacity=".22"/><rect x="150" y="0" width="60" height="190" fill="var(--soft)" opacity=".3"/>
<g fill="var(--bg)"><ellipse cx="166" cy="34" rx="6" ry="10"/><ellipse cx="190" cy="70" rx="7" ry="11"/><ellipse cx="170" cy="112" rx="6" ry="12"/><ellipse cx="194" cy="150" rx="7" ry="10"/></g>
<g id="d"></g>
<text class="t" x="75" y="18">Vent fluid</text><text class="t" x="180" y="18">Mineral wall</text><text class="t" x="285" y="18">Ocean</text>
<text class="t" x="180" y="182" style="font-size:10px">e⁻ cross the mineral</text>
<g id="m"><line id="ml" x1="0" y1="26" x2="0" y2="168" stroke="var(--gold)" stroke-width="3"/><circle id="mc" cx="0" cy="97" r="7" fill="var(--gold)" stroke="var(--bg)" stroke-width="2"/></g></svg>
<input type="range" id="r" min="0" max="100" value="12" aria-label="Position across the chimney wall"><div class="lab"><span>Vent side</span><span>Drag across</span><span>Ocean side</span></div>
<div class="read"><div>pH here<b id="ph"></b></div><div>Protons vs vent<b id="pf"></b></div><div>Hydrogen<span class="bar"><i id="h"></i></span></div><div>Carbon dioxide<span class="bar"><i id="c"></i></span></div></div>
<div class="panel"><h2 id="t"></h2><p id="d2"></p><p class="ev" id="e"></p></div>
<div class="key"><span><i style="background:var(--vent)"></i>Alkaline vent fluid</span><span><i style="background:var(--sea)"></i>Acidic early ocean</span></div>
<script>
var Z=[["Vent fluid","Alkaline, warm and full of hydrogen made by the rock below. Very few protons here.","Fluid at Lost City runs between pH 9 and 11."],
["The wall","A thin film of metal minerals riddled with pores. Hydrogen gives up electrons on the vent side, the electrons cross the mineral, and carbon dioxide takes them on the ocean side. In the lab version the film was under ten micrometres thick.","Whether real chimney walls held a gradient this sharp is debated."],
["The early ocean","Slightly acidic, thought to be near pH 6, and rich in dissolved carbon dioxide and iron. Many protons here.","Modern seawater is near pH 8. The acidic ocean is an assumption of the hypothesis, not a measurement."]];
var g=document.getElementById("d"),N="http://www.w3.org/2000/svg",s=7;function rnd(){s=(s*9301+49297)%233280;return s/233280}
for(var i=0;i<26;i++){var c=document.createElementNS(N,"circle");c.setAttribute("cx",8+rnd()*130);c.setAttribute("cy",30+rnd()*140);c.setAttribute("r",3);c.setAttribute("fill","var(--vent)");g.appendChild(c)}
for(var j=0;j<26;j++){var k=document.createElementNS(N,"circle");k.setAttribute("cx",222+rnd()*130);k.setAttribute("cy",30+rnd()*140);k.setAttribute("r",3.5);k.setAttribute("fill","var(--sea)");g.appendChild(k)}
var r=document.getElementById("r");
function up(){var v=+r.value,x=10+3.4*v,p=6+5/(1+Math.exp((v-50)/5)),h=100/(1+Math.exp((v-50)/7)),z=v<38?0:v<62?1:2;
document.getElementById("ml").setAttribute("x1",x);document.getElementById("ml").setAttribute("x2",x);document.getElementById("mc").setAttribute("cx",x);
document.getElementById("ph").textContent=p.toFixed(1);document.getElementById("pf").textContent="×"+Math.round(Math.pow(10,11-p)).toLocaleString("en-US");
document.getElementById("h").style.width=h+"%";document.getElementById("c").style.width=(100-h)+"%";
document.getElementById("t").textContent=Z[z][0];document.getElementById("d2").textContent=Z[z][1];document.getElementById("e").textContent=Z[z][2]}
r.addEventListener("input",up);up();
</script></main><script>(function(){function f(){try{frameElement.style.height=(document.querySelector("main").offsetHeight+2)+"px"}catch(e){}}addEventListener("load",f);addEventListener("resize",f);try{new ResizeObserver(f).observe(document.body)}catch(e){}})();</script></body></html>
