<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clues that a mitochondrion was once a bacterium - What If</title>

<style>

.p.on{stroke:var(--gold);stroke-width:4.5}.dot.on{fill:var(--gold)}.x{opacity:0;transition:opacity .2s}.x.on{opacity:1}

.row{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;font-size:.95rem;line-height:1.5}.row i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:.45em}

</style><script>(function(){var r=document.documentElement;function s(){var t=null;try{t=parent.document.documentElement.getAttribute("data-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";r.setAttribute("data-theme",t)}s();try{new MutationObserver(s).observe(parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}})();</script></head><body><main><div class="chips" id="chips" role="group" aria-label="Clues"></div>

<div class="panel"><h2 id="t">Tap a clue</h2><div id="b"><p>A mitochondrion and a bacterium share a set of features. Pick one to light it up in both drawings.</p></div><p class="ev" id="e">Drawings are schematic, not to scale.</p></div>

<script>
var K={mem:["Two membranes","Gram-negative bacteria, the group that includes the alphaproteobacteria, are wrapped in an inner and an outer membrane.","A mitochondrion has an outer membrane and a folded inner one. The folded inner membrane is where it makes ATP, much as a bacterium makes it at its cell membrane.","The match is general. How each membrane was inherited is still debated."],
dna:["Circular DNA","Typically one circular chromosome.","Its own small chromosome, circular in humans and 16,569 letters long.","Some eukaryotes carry linear mitochondrial genomes, so the shape varies."],
